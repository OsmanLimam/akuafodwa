<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AkuafoDwa: Offline</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #fffdf5;
      color: #1f2937;
      font-family: system-ui, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      background: #fff8f2;
      border: 1px solid #dde5de;
      border-radius: 24px;
      padding: 40px 32px;
    }
    h1 { font-size: 1.5rem; margin: 16px 0 8px; }
    p { color: #6e4a5e; line-height: 1.6; margin: 0 0 20px; }
    button {
      background: #1b5e20;
      color: #fffdf5;
      border: 0;
      border-radius: 999px;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="AkuafoDwa" width="72" height="72" style="border-radius:18px" />
    <h1>You are offline</h1>
    <p>The market needs an internet connection. Check your network and try again, your saved deals are waiting.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
